# Optional Render Blueprint: New + > Blueprint > pick this repo.
services:
  - type: web
    name: nosql-quiz-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_NAME
        value: nosql_seminar
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
